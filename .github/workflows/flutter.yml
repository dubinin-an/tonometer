name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      # dartcv4 declares an exact native-build dependency on CMake 3.22.1.
      - name: Install CMake 3.22.1
        uses: lukka/get-cmake@v4.4.2
        with:
          cmakeVersion: 3.22.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
